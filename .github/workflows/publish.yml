name: Publish npm
on:
  push:
    tags:
      - "v*"
jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require tagged commit is on master
        run: |
          git fetch origin master
          bash scripts/require-on-master.sh "$GITHUB_SHA" origin/master
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bash scripts/npm-release.sh
